<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Grid Controller</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0a0a0a;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        
        h1 {
            font-size: 1.5em;
            font-weight: 300;
            margin-bottom: 20px;
            letter-spacing: 0.1em;
        }
        
        #status {
            padding: 15px;
            background: #1a1a1a;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        #status.connected {
            border-left: 4px solid #4CAF50;
        }
        
        #status.disconnected {
            border-left: 4px solid #f44336;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #666;
        }
        
        .status-dot.active {
            background-color: #4CAF50;
            box-shadow: 0 0 10px #4CAF50;
        }
        
        #grid-section {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        #grid-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 10px 20px;
            background: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        
        button:hover {
            background: #3a3a3a;
            border-color: #4a4a4a;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        button.primary {
            background: #1a4d2e;
            border-color: #2a5d3e;
        }
        
        button.primary:hover {
            background: #2a5d3e;
        }
        
        #grid-display {
            background: #0a0a0a;
            border-radius: 8px;
            padding: 20px;
            display: inline-block;
            margin: 0 auto;
        }
        
        #grid-container {
            display: grid;
            grid-template-columns: repeat(16, 32px);
            grid-template-rows: repeat(8, 32px);
            gap: 2px;
            margin: 0 auto;
        }
        
        .grid-cell {
            width: 32px;
            height: 32px;
            background: #2a2a2a;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.1s;
            position: relative;
        }
        
        .grid-cell.active {
            background: #f8d568;
            box-shadow: 0 0 15px #f8d568;
        }
        
        .grid-cell.zone-root {
            background: #3a2a4a;
        }
        
        .grid-cell.zone-intervals {
            background: #2a3a4a;
        }
        
        .grid-cell.zone-modulation {
            background: #2a4a3a;
        }
        
        .grid-cell.zone-dynamics {
            background: #4a3a2a;
        }
        
        #mode-section {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .mode-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .mode-button {
            padding: 12px 24px;
            background: #2a2a2a;
            border: 2px solid #3a3a3a;
            color: #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .mode-button.active {
            background: #3a4a5a;
            border-color: #5a7a9a;
            box-shadow: 0 0 10px rgba(90, 122, 154, 0.5);
        }
        
        #params-section {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .param-group {
            margin-bottom: 20px;
        }
        
        .param-label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #aaa;
        }
        
        .param-control {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        input[type="range"] {
            flex: 1;
            height: 6px;
            background: #2a2a2a;
            outline: none;
            -webkit-appearance: none;
            border-radius: 3px;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #e0e0e0;
            border-radius: 50%;
            cursor: pointer;
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #e0e0e0;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
        
        .param-value {
            min-width: 60px;
            text-align: right;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }
        
        #synth-list {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 20px;
        }
        
        .synth-item {
            padding: 10px;
            background: #2a2a2a;
            border-radius: 4px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .synth-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .latency {
            font-size: 12px;
            color: #888;
            font-family: 'Courier New', monospace;
        }
        
        .zone-legend {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }
        
        .zone-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .zone-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DRONE GRID CONTROLLER</h1>
        
        <div id="status" class="disconnected">
            <div class="status-indicator">
                <span class="status-dot" id="grid-status-dot"></span>
                <span id="grid-status-text">Grid: Disconnected</span>
            </div>
            <div class="status-indicator">
                <span class="status-dot" id="ws-status-dot"></span>
                <span id="ws-status-text">Server: Disconnected</span>
            </div>
        </div>
        
        <div id="grid-section">
            <div id="grid-controls">
                <button id="connect-grid" class="primary">Connect Grid</button>
                <button id="disconnect-grid" disabled>Disconnect</button>
                <button id="clear-grid" disabled>Clear</button>
                <button id="test-pattern" disabled>Test Pattern</button>
            </div>
            
            <div id="grid-display">
                <div id="grid-container"></div>
                <div class="zone-legend" id="zone-legend">
                    <div class="zone-item">
                        <div class="zone-color" style="background: #3a2a4a"></div>
                        <span>Root</span>
                    </div>
                    <div class="zone-item">
                        <div class="zone-color" style="background: #2a3a4a"></div>
                        <span>Intervals</span>
                    </div>
                    <div class="zone-item">
                        <div class="zone-color" style="background: #2a4a3a"></div>
                        <span>Modulation</span>
                    </div>
                    <div class="zone-item">
                        <div class="zone-color" style="background: #4a3a2a"></div>
                        <span>Dynamics</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="mode-section">
            <h3>Mode</h3>
            <div class="mode-buttons">
                <button class="mode-button active" data-mode="harmonic">Harmonic</button>
                <button class="mode-button" data-mode="percussive">Percussive</button>
                <button class="mode-button" data-mode="textural">Textural</button>
                <button class="mode-button" data-mode="spatial">Spatial</button>
            </div>
        </div>
        
        <div id="params-section">
            <h3>Global Parameters</h3>
            
            <div class="param-group">
                <label class="param-label">Root Frequency</label>
                <div class="param-control">
                    <input type="range" id="root-freq" min="55" max="220" value="110" step="1">
                    <span class="param-value" id="root-freq-value">110 Hz</span>
                </div>
            </div>
            
            <div class="param-group">
                <label class="param-label">Master Volume</label>
                <div class="param-control">
                    <input type="range" id="master-volume" min="0" max="100" value="70">
                    <span class="param-value" id="master-volume-value">70%</span>
                </div>
            </div>
            
            <div class="param-group">
                <label class="param-label">Filter Cutoff</label>
                <div class="param-control">
                    <input type="range" id="filter-cutoff" min="100" max="8000" value="2000" step="10">
                    <span class="param-value" id="filter-cutoff-value">2000 Hz</span>
                </div>
            </div>
            
            <div class="param-group">
                <label class="param-label">Reverb Mix</label>
                <div class="param-control">
                    <input type="range" id="reverb-mix" min="0" max="100" value="30">
                    <span class="param-value" id="reverb-mix-value">30%</span>
                </div>
            </div>
            
            <div class="param-group">
                <label class="param-label">Delay Mix</label>
                <div class="param-control">
                    <input type="range" id="delay-mix" min="0" max="100" value="20">
                    <span class="param-value" id="delay-mix-value">20%</span>
                </div>
            </div>
        </div>
        
        <div id="synth-list">
            <h3>Connected Synths</h3>
            <div id="synths"></div>
        </div>
    </div>
    
    <script type="module">
        import { MonomeGrid } from './lib/monome-grid.js';
        import { GridDroneMapper } from './lib/grid-drone-mapper.js';
        
        // Controller ID
        const controller_id = `ctrl-${Math.random().toString(36).substr(2, 9)}`;
        
        // State
        let grid = null;
        let mapper = null;
        let ws = null;
        let peers = new Map();
        let connected_to_grid = false;
        let connected_to_server = false;
        
        // UI Elements
        const connectBtn = document.getElementById('connect-grid');
        const disconnectBtn = document.getElementById('disconnect-grid');
        const clearBtn = document.getElementById('clear-grid');
        const testBtn = document.getElementById('test-pattern');
        const gridContainer = document.getElementById('grid-container');
        const gridStatusDot = document.getElementById('grid-status-dot');
        const gridStatusText = document.getElementById('grid-status-text');
        const wsStatusDot = document.getElementById('ws-status-dot');
        const wsStatusText = document.getElementById('ws-status-text');
        const statusDiv = document.getElementById('status');
        
        // Parameter controls
        const rootFreqSlider = document.getElementById('root-freq');
        const masterVolumeSlider = document.getElementById('master-volume');
        const filterCutoffSlider = document.getElementById('filter-cutoff');
        const reverbMixSlider = document.getElementById('reverb-mix');
        const delayMixSlider = document.getElementById('delay-mix');
        
        // Mode buttons
        const modeButtons = document.querySelectorAll('.mode-button');
        
        // Initialize mapper
        mapper = new GridDroneMapper({
            width: 16,
            height: 8,
            rootFrequency: parseFloat(rootFreqSlider.value)
        });
        
        // Create grid UI
        for (let y = 0; y < 8; y++) {
            for (let x = 0; x < 16; x++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.dataset.x = x;
                cell.dataset.y = y;
                cell.addEventListener('click', () => handleGridClick(x, y));
                gridContainer.appendChild(cell);
            }
        }
        
        // Update grid UI zones
        function updateGridZones() {
            const cells = gridContainer.querySelectorAll('.grid-cell');
            cells.forEach(cell => {
                const x = parseInt(cell.dataset.x);
                const y = parseInt(cell.dataset.y);
                const zone = mapper.getZone(x, y);
                
                // Remove old zone classes
                cell.classList.remove('zone-root', 'zone-intervals', 'zone-modulation', 'zone-dynamics');
                
                // Add new zone class
                if (zone) {
                    cell.classList.add(`zone-${zone.name}`);
                }
            });
        }
        
        // Initialize zones
        updateGridZones();
        
        // Grid event handlers
        connectBtn.addEventListener('click', async () => {
            try {
                grid = new MonomeGrid();
                
                grid.addEventListener('connected', (e) => {
                    connected_to_grid = true;
                    gridStatusDot.classList.add('active');
                    gridStatusText.textContent = `Grid: Connected (${e.detail.width}x${e.detail.height})`;
                    connectBtn.disabled = true;
                    disconnectBtn.disabled = false;
                    clearBtn.disabled = false;
                    testBtn.disabled = false;
                    updateStatus();
                });
                
                grid.addEventListener('disconnected', () => {
                    connected_to_grid = false;
                    gridStatusDot.classList.remove('active');
                    gridStatusText.textContent = 'Grid: Disconnected';
                    connectBtn.disabled = false;
                    disconnectBtn.disabled = true;
                    clearBtn.disabled = true;
                    testBtn.disabled = true;
                    updateStatus();
                });
                
                grid.addEventListener('gridKey', (e) => {
                    const { x, y, pressed } = e.detail;
                    handleGridKey(x, y, pressed);
                });
                
                await grid.connect();
            } catch (error) {
                console.error('Failed to connect to grid:', error);
                alert('Failed to connect to grid. Make sure serialosc is not running.');
            }
        });
        
        disconnectBtn.addEventListener('click', async () => {
            if (grid) {
                await grid.disconnect();
                grid = null;
            }
        });
        
        clearBtn.addEventListener('click', async () => {
            if (grid) {
                await grid.clear();
                updateGridUI();
            }
        });
        
        testBtn.addEventListener('click', async () => {
            if (grid) {
                // Simple test pattern
                for (let y = 0; y < 8; y++) {
                    for (let x = 0; x < 16; x++) {
                        await grid.ledLevel(x, y, Math.floor(Math.random() * 16));
                        await grid.delay(10);
                    }
                }
            }
        });
        
        // Grid interaction
        async function handleGridClick(x, y) {
            // Simulate grid press for testing without hardware
            handleGridKey(x, y, true);
            setTimeout(() => handleGridKey(x, y, false), 200);
        }
        
        async function handleGridKey(x, y, pressed) {
            // Update visual feedback
            const cell = gridContainer.querySelector(`[data-x="${x}"][data-y="${y}"]`);
            if (cell) {
                if (pressed) {
                    cell.classList.add('active');
                } else if (!mapper.holdMode) {
                    cell.classList.remove('active');
                }
            }
            
            // Process through mapper
            mapper.handleGridKey(x, y, pressed);
            
            // Update physical grid LED
            if (grid && connected_to_grid) {
                const ledState = mapper.getLEDState(x, y);
                await grid.ledLevel(x, y, pressed ? 15 : ledState);
            }
        }
        
        // Update grid UI
        function updateGridUI() {
            const cells = gridContainer.querySelectorAll('.grid-cell');
            cells.forEach(cell => {
                const x = parseInt(cell.dataset.x);
                const y = parseInt(cell.dataset.y);
                const ledState = mapper.getLEDState(x, y);
                
                if (ledState > 8) {
                    cell.classList.add('active');
                } else {
                    cell.classList.remove('active');
                }
            });
        }
        
        // Mapper event handlers
        mapper.addEventListener('noteOn', (e) => {
            sendToSynths({
                type: 'noteOn',
                frequency: e.detail.frequency,
                velocity: e.detail.velocity,
                ratio: e.detail.ratio
            });
        });
        
        mapper.addEventListener('noteOff', (e) => {
            sendToSynths({
                type: 'noteOff',
                frequency: e.detail.frequency
            });
        });
        
        mapper.addEventListener('rootChange', (e) => {
            rootFreqSlider.value = e.detail.frequency;
            document.getElementById('root-freq-value').textContent = `${Math.round(e.detail.frequency)} Hz`;
            sendToSynths({
                type: 'rootChange',
                frequency: e.detail.frequency
            });
        });
        
        mapper.addEventListener('modulation', (e) => {
            sendToSynths({
                type: 'modulation',
                x: e.detail.x,
                y: e.detail.y,
                modType: e.detail.type,
                pressed: e.detail.pressed
            });
        });
        
        mapper.addEventListener('dynamics', (e) => {
            sendToSynths({
                type: 'dynamics',
                level: e.detail.level,
                filterCutoff: e.detail.filterCutoff
            });
        });
        
        // Mode switching
        modeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const mode = btn.dataset.mode;
                mapper.setMode(mode);
                
                // Update UI
                modeButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // Update grid zones
                updateGridZones();
                
                // Send mode change to synths
                sendToSynths({
                    type: 'modeChange',
                    mode: mode
                });
            });
        });
        
        // Parameter controls
        rootFreqSlider.addEventListener('input', (e) => {
            const freq = parseFloat(e.target.value);
            document.getElementById('root-freq-value').textContent = `${freq} Hz`;
            mapper.rootFrequency = freq;
            sendToSynths({
                type: 'rootChange',
                frequency: freq
            });
        });
        
        masterVolumeSlider.addEventListener('input', (e) => {
            const value = parseInt(e.target.value) / 100;
            document.getElementById('master-volume-value').textContent = `${e.target.value}%`;
            sendToSynths({
                type: 'param',
                name: 'masterVolume',
                value: value
            });
        });
        
        filterCutoffSlider.addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            document.getElementById('filter-cutoff-value').textContent = `${value} Hz`;
            sendToSynths({
                type: 'param',
                name: 'filterCutoff',
                value: value
            });
        });
        
        reverbMixSlider.addEventListener('input', (e) => {
            const value = parseInt(e.target.value) / 100;
            document.getElementById('reverb-mix-value').textContent = `${e.target.value}%`;
            sendToSynths({
                type: 'param',
                name: 'reverbMix',
                value: value
            });
        });
        
        delayMixSlider.addEventListener('input', (e) => {
            const value = parseInt(e.target.value) / 100;
            document.getElementById('delay-mix-value').textContent = `${e.target.value}%`;
            sendToSynths({
                type: 'param',
                name: 'delayMix',
                value: value
            });
        });
        
        // WebSocket connection
        function connectWebSocket() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}`);
            
            ws.addEventListener('open', () => {
                connected_to_server = true;
                wsStatusDot.classList.add('active');
                wsStatusText.textContent = 'Server: Connected';
                updateStatus();
                
                // Register with server
                ws.send(JSON.stringify({
                    type: 'register',
                    client_id: controller_id
                }));
                
                // Start heartbeat
                setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'heartbeat',
                            source: controller_id
                        }));
                    }
                }, 5000);
            });
            
            ws.addEventListener('close', () => {
                connected_to_server = false;
                wsStatusDot.classList.remove('active');
                wsStatusText.textContent = 'Server: Disconnected';
                updateStatus();
                
                // Reconnect after delay
                setTimeout(connectWebSocket, 3000);
            });
            
            ws.addEventListener('message', async (event) => {
                const message = JSON.parse(event.data);
                handleWebSocketMessage(message);
            });
        }
        
        // Handle WebSocket messages
        async function handleWebSocketMessage(message) {
            switch (message.type) {
                case 'offer':
                    await handleOffer(message);
                    break;
                case 'answer':
                    await handleAnswer(message);
                    break;
                case 'ice':
                    await handleIce(message);
                    break;
            }
        }
        
        // WebRTC handling
        async function handleOffer(message) {
            const pc = new RTCPeerConnection(await getRTCConfig());
            const synthId = message.source;
            
            // Create data channels
            const paramChannel = pc.createDataChannel('params', { ordered: false });
            const commandChannel = pc.createDataChannel('commands', { ordered: true });
            
            const peer = {
                id: synthId,
                connection: pc,
                paramChannel,
                commandChannel,
                connected: false,
                lastPing: Date.now()
            };
            
            peers.set(synthId, peer);
            
            // Set up data channel handlers
            paramChannel.onopen = () => {
                console.log(`Param channel open to ${synthId}`);
                peer.connected = true;
                updateSynthList();
                sendInitialState(peer);
            };
            
            commandChannel.onopen = () => {
                console.log(`Command channel open to ${synthId}`);
            };
            
            paramChannel.onclose = () => {
                peer.connected = false;
                updateSynthList();
            };
            
            // Handle ICE candidates
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    ws.send(JSON.stringify({
                        type: 'ice',
                        source: controller_id,
                        target: synthId,
                        data: event.candidate
                    }));
                }
            };
            
            // Set remote description and create answer
            await pc.setRemoteDescription(new RTCSessionDescription(message.data));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            
            ws.send(JSON.stringify({
                type: 'answer',
                source: controller_id,
                target: synthId,
                data: answer
            }));
        }
        
        async function handleAnswer(message) {
            const peer = peers.get(message.source);
            if (peer) {
                await peer.connection.setRemoteDescription(new RTCSessionDescription(message.data));
            }
        }
        
        async function handleIce(message) {
            const peer = peers.get(message.source);
            if (peer) {
                await peer.connection.addIceCandidate(new RTCIceCandidate(message.data));
            }
        }
        
        // Get RTC configuration
        async function getRTCConfig() {
            try {
                const response = await fetch('/ice-servers');
                const data = await response.json();
                return { iceServers: data.ice_servers };
            } catch (error) {
                return { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
            }
        }
        
        // Send to all connected synths
        function sendToSynths(data) {
            peers.forEach(peer => {
                if (peer.connected && peer.paramChannel.readyState === 'open') {
                    peer.paramChannel.send(JSON.stringify(data));
                }
            });
        }
        
        // Send initial state to new synth
        function sendInitialState(peer) {
            // Send current mode
            const activeMode = document.querySelector('.mode-button.active');
            if (activeMode) {
                peer.commandChannel.send(JSON.stringify({
                    type: 'modeChange',
                    mode: activeMode.dataset.mode
                }));
            }
            
            // Send parameters
            peer.paramChannel.send(JSON.stringify({
                type: 'param',
                name: 'masterVolume',
                value: parseInt(masterVolumeSlider.value) / 100
            }));
            
            peer.paramChannel.send(JSON.stringify({
                type: 'param',
                name: 'filterCutoff',
                value: parseInt(filterCutoffSlider.value)
            }));
            
            peer.paramChannel.send(JSON.stringify({
                type: 'param',
                name: 'reverbMix',
                value: parseInt(reverbMixSlider.value) / 100
            }));
            
            peer.paramChannel.send(JSON.stringify({
                type: 'param',
                name: 'delayMix',
                value: parseInt(delayMixSlider.value) / 100
            }));
            
            peer.paramChannel.send(JSON.stringify({
                type: 'rootChange',
                frequency: parseFloat(rootFreqSlider.value)
            }));
        }
        
        // Update synth list UI
        function updateSynthList() {
            const synthsDiv = document.getElementById('synths');
            synthsDiv.innerHTML = '';
            
            peers.forEach((peer, id) => {
                const div = document.createElement('div');
                div.className = 'synth-item';
                
                const info = document.createElement('div');
                info.className = 'synth-info';
                
                const status = document.createElement('span');
                status.textContent = peer.connected ? '● Connected' : '○ Disconnected';
                status.style.color = peer.connected ? '#4CAF50' : '#888';
                
                const idSpan = document.createElement('span');
                idSpan.textContent = id;
                
                info.appendChild(status);
                info.appendChild(idSpan);
                
                div.appendChild(info);
                synthsDiv.appendChild(div);
            });
        }
        
        // Update overall status
        function updateStatus() {
            if (connected_to_grid && connected_to_server) {
                statusDiv.className = 'connected';
            } else {
                statusDiv.className = 'disconnected';
            }
        }
        
        // Initialize WebSocket connection
        connectWebSocket();
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', async () => {
            if (grid) {
                await grid.disconnect();
            }
        });
    </script>
</body>
</html>
